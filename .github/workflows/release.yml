name: Build Windows EXE for Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build and Attach EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go build -o script.exe ./...
          gh release upload ${{ github.event.release.tag_name }} script.exe --clobber